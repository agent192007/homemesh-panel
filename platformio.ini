; ============================================================
;  ESP32-2432S032 (3.2" CYD) hardware triage
; ============================================================
;
;  Four environments. Only one source file compiles in each,
;  so they don't fight over setup()/loop().
;
;  Run them in this order:
;
;    1. touchscan     - identifies the touch controller. No
;                       display config needed. Do this first.
;    2. display_ili   - display test assuming ILI9341.
;    3. display_st    - same test assuming ST7789V + inversion.
;                       Only needed if display_ili showed
;                       inverted colours.
;    4. panel         - the real HomeMesh firmware (default).
;                       Result: ST7789V display, GT911 touch
;                       on SDA=33 SCL=32 at 0x5D.
;
;  Build/upload a specific environment:
;    pio run -e touchscan -t upload -t monitor
;
;  Or pick the environment from the PlatformIO toolbar in VS Code.
; ============================================================

[platformio]
default_envs = panel

; ------------------------------------------------------------
;  Shared settings
; ------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; If uploads fail, comment this out to fall back to 115200.
upload_speed = 921600

; ------------------------------------------------------------
;  1. Touch controller scan
;     No display library, no TFT config. Deliberately minimal
;     so nothing can interfere with the I2C bus.
; ------------------------------------------------------------
[env:touchscan]
build_src_filter = +<i2c_touch_scan.cpp>

; ------------------------------------------------------------
;  TFT_eSPI pin mapping for the ESP32-2432S032
;
;  These are the community-reported pins for this board. If the
;  display test gives a white screen, these are the first thing
;  to question - batch variation is exactly the risk here.
;
;  USER_SETUP_LOADED=1 tells TFT_eSPI to ignore its own
;  User_Setup.h entirely and use these flags instead. That is
;  why you never have to edit inside the library folder.
; ------------------------------------------------------------
[tft_pins]
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000

; ------------------------------------------------------------
;  2. Display test - ILI9341 hypothesis (try this first)
; ------------------------------------------------------------
[env:display_ili]
build_src_filter = +<display_driver_test.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${tft_pins.build_flags}
    -D ILI9341_DRIVER=1

; ------------------------------------------------------------
;  3. Display test - ST7789V hypothesis
;     Use only if display_ili gave inverted colours.
;
;     TFT_INVERSION_ON is the usual fix. If instead you get a
;     shifted image with a garbage stripe, the panel needs CGRAM
;     offsets - say so and we'll sort the offset values.
; ------------------------------------------------------------
[env:display_st]
build_src_filter = +<display_driver_test.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${tft_pins.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR

; ------------------------------------------------------------
;  4. HomeMesh Panel firmware (the real one).
;     Pinned to LVGL 8.3.x deliberately - 8.4/9.x changed the
;     display and input driver API, and most CYD example code
;     you will find online is written against 8.3.
;
;     Builds everything in src/ except the triage sketches.
;     GT911 is driven directly in touch_driver.cpp (no library).
; ------------------------------------------------------------
[env:panel]
build_src_filter = +<*> -<i2c_touch_scan.cpp> -<display_driver_test.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@~8.3.11
    knolleary/PubSubClient@^2.8
build_flags =
    ${tft_pins.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D MQTT_MAX_PACKET_SIZE=1024
    ; Touch is GT911 via touch_driver.cpp, not TFT_eSPI's resistive
    ; touch, so its TOUCH_CS warning is noise.
    -D DISABLE_ALL_LIBRARY_WARNINGS=1